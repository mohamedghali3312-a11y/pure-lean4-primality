name: Pure Lean 4 Primality & Benchmark CI
on: [push, pull_request]
jobs:
  verify-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Compile PurePrimality & Run 64-bit Benchmark
        run: |
          LEAN_PATH=. lean -o PurePrimality.olean PurePrimality.lean
          START=$(date +%s%N)
          LEAN_PATH=. lean BenchmarkPrimality.lean
          END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "Benchmark & Kernel Proof Execution Time: ${ELAPSED_MS} ms"
